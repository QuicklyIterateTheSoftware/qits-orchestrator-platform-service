# THE QA PIPELINE — this repository's only per-change pipeline, and it runs for RELEASE REQUESTS
# ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in the commit that
# added this file; ci-event-release.yml and ci-event-upstream-frontend.yml are untouched. The
# reference template with the full argument is qits-ci's docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating build is FIRST; the userflow half declares `gating: false`, which still fails the run and
# shows red but does not hold the fold for qits-projects' build gate. Keep it LAST: everything after
# a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE. The old build step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-orchestrator:$QITS_CI_SHA`, the per-push
# coordinate cd keyed on; a fold's merged sha is not a coordinate anything could deploy. The image
# is still BUILT here — the gate on the fold — and the CalVer coordinate is ci-event-release.yml's,
# untouched. Since the build moved to the platform's own buildkitd there is not even a local tag
# left: the build carries no exporter at all, so what a green fold leaves behind is the builder's
# cache and nothing else.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match belongs on the name. The event echoes the public name; a rename updates
  # this line in the same campaign. `suppressCi` went with the push event that carried it — a
  # release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-orchestrator-platform-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS — a green verdict for a fold that does not build is exactly what
      # a release gate must never be told. -u is load-bearing too: an unset injected address must
      # stop the step rather than being folded into a build argument as an empty string.
      set -eu

      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # --- half one: the client -------------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the qits-orchestrator-platform-frontend submodule at
      # service/src/main/webui arrives as an empty directory — and the Dockerfile's `test -f` guard
      # stops the image build on exactly that (Quinoa's own `No package.json found in Web UI
      # directory` would stop it a moment later). Initialising it here rather than asking the daemon
      # to clone differently keeps the submodule this repo's business, and the derived URL is what
      # makes the committed relative one resolve against whichever host this run cloned from.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-orchestrator-platform-frontend"
      git -c submodule.qits-orchestrator-platform-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. npm pins a full
      # resolved URL per package, and the SPA's lockfile is generated on the deployment host, so every
      # entry names an edge address that does not exist in this container. `npm ci` fetches tarballs
      # by that URL and never asks the configured registry for them, so the environment below does not
      # reach them: without this swap the install dies on connection refused. The paths are identical
      # on every address, so replacing the ORIGIN and keeping the path is all it takes, and the
      # integrity hashes are what make that safe — bytes from the other address must still hash the
      # same. The checkout is this step's own; nothing is edited that anyone will read again.
      #
      # THE BYTE PLANE IS TWO SERVICES, WHICH IS WHY THE SWAP READS THE PATH. qits-platform-mirror
      # holds the npmjs pull-through cache; qits-artifacts hosts the @qits scope. No single origin
      # serves both, so the path is what tells them apart: an entry under the hosted registry's own
      # pathname — $QITS_NPM_REGISTRY_URL's — is a @qits tarball and gets the hosted origin, and every
      # other entry gets the proxy's.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either —
      # qits-workspaces' recipe measures that failure in full.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-orchestrator-platform-frontend COMMITS an .npmrc (the edge vhosts, right for
      # a developer on the deployment host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a
      # `cat > ~/.npmrc` preamble would be written and silently ignored. `npm_config_*` environment
      # outranks both files, so it wins without touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-platform-spa-orchestrator/browser — the bundle the image build consumes, and the ONE
      # artifact this half exists to produce. Lint and test are qits-orchestrator-platform-frontend's own
      # pipeline's job; repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --- half two: the image --------------------------------------------------------------------
      # THE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON. qits-buildkit-plan.md in
      # the wrapper is the migration and qits-workspace-daemon's recipe pair is the worked reference;
      # read those rather than expecting the argument restated here. `build: true` is the
      # declaration that replaced `docker: true`: it grants the builder's address ($BUILDKIT_HOST,
      # injected by qits-containers) and this run's commissioned credential, and it does NOT mount
      # the host docker socket — which this step no longer touches at all.
      #
      # THE BUILDER, DEMANDED LOUDLY BEFORE ANYTHING IS BUILT. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false spells
      # off as empty-never-absent). Either way this step must fail here, naming the cause, rather
      # than run on as if a build had happened. $QITS_BUILD_REGISTRY is deliberately NOT demanded:
      # this step composes no reference, because it publishes nothing.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      # NO --network host, AND NOTHING REPLACES IT. Every `RUN` executes in the builder's own network
      # namespace on qits-net, so what the build dials, it dials by IN-NETWORK address. That is why
      # the Maven repository arg is $QITS_MAVEN_REGISTRY_URL — the same address the userflow step
      # below exports — rather than the host-published `http://$QITS_REGISTRY/…` this line carried
      # while the host daemon ran the build; and why Maven Central rides $QITS_MAVEN_PROXY_URL rather
      # than $QITS_MAVEN_CENTRAL_MIRROR_URL, which is an edge vhost on the host loopback and is now
      # unreachable from a build, by design. The build needs both because this repo depends on
      # qits-db-core, qits-auth-core and qits-arch-rules; an empty Central value deactivates the
      # settings profile and the resolve goes to Central directly, as it always did. The Dockerfile's
      # `FROM` lines keep their committed edge-vhost spellings — the builder's own registry config
      # rewrites those to the platform aliases.
      #
      # THE CREDENTIAL IS A SECRET AND NEVER A BUILD ARG — an arg is recorded in the image history.
      # In FILE form on both sides now: written here under umask 077 into /tmp, which is outside the
      # clone so neither file can enter the build context, handed to buildctl as `src=`, and mounted
      # by the Dockerfile as a bare file under /run/secrets. Never the `env=` mount form, which
      # couples the recipe to whichever dockerfile frontend the builder happens to run. The launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; `:-` keeps the pair OPTIONAL
      # exactly as it was under `--secret …,env=`, so a deployment with no idp client still builds
      # green and the Dockerfile reads two empty files.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret
      # NO --output, WHICH IS THE WHOLE POINT OF THIS STEP. The registry-qualified `:$QITS_CI_SHA`
      # coordinate was the per-push publication and retired with the push path, and there is no local
      # image store on this side to leave a bare tag in either — so the build runs to completion and
      # its result is discarded. What it leaves is the builder's content-addressed cache, which
      # ci-event-release.yml's identical build then hits; keep the two argument lists matched.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`, which is the whole of what that
  # separate file was.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the five story
  # classes named below — and the reports published as one docs bundle, site
  # @userflows/qits-orchestrator-platform-service, version = the merged sha, branch riding as
  # artifacts metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # THIS STEP IS WHERE THIS REPOSITORY'S SUITE RUNS AT ALL, and that is worth knowing before reading
  # anything below. The image build carries `-DskipTests` in its Dockerfile's mvnw line, so until the
  # userflow file existed every test here had only ever run on a developer's machine. What `verify`
  # runs on the way to failsafe is both modules' surefire suites — `orchestrator`'s executor,
  # peer-client and gc-process tests and `service`'s API tests — and every one of them boots against
  # a real postgres.
  #
  # `user: build`, and NOT a switch inside the script: those suites start zonky's embedded postgres,
  # initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root user
  # — maven-base carries one (uid 1001). The step containers are Alpine, which is why BOTH poms that
  # name zonky architectures (orchestrator, service) carry the -alpine binaries as a fourth arch:
  # `verify` here is the whole reactor, so the domain module's postgres has to start there too. A step
  # container is started --cap-drop=ALL either way; /workspace is 1777 with a system-level
  # safe.directory entry, so a non-root checkout is what the image was built to serve.
  #
  # THERE IS NO DOCKER SOCKET IN THIS STEP AND NONE IS WANTED, and the stories reach nothing outside
  # this container. This service holds no docker socket in production either — that is qits-containers'
  # — and every peer the launched artifact talks to here is on localhost: stories.support.StoryPeers is
  # one com.sun HttpServer impersonating all six by path prefix (plus the idp token endpoint the six
  # oidc clients mint against), and qits-service-mock's MockIdp is a second one serving the JWKS. Four
  # gc runs happen in this step and not one of their requests leaves the container — the only outbound
  # traffic is maven's, to the platform registry. `docker: true` would be a grant for nothing.
  #
  # Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
  # ignored and npm still runs): the client is the gating step's business, where the
  # qits-orchestrator-platform-frontend submodule is initialised and its lockfile origins are swapped
  # against the platform's npm registry, and none of that ritual belongs here — the stories assert
  # nothing about the SPA. It is also what keeps this step from needing the submodule at all: the
  # daemon's clone does not recurse, so service/src/main/webui arrives EMPTY, and an empty directory
  # is the one case Quinoa treats as a misconfiguration rather than as "no client".
  #
  # THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
  # module back into ITs the way qits-githost does. `skipITs` is true in the root pom and stays true;
  # this module has six integration tests and five of them belong to this run:
  #
  #   api.TokenValidationBootstrapIT        the boot: the gate on, the JWKS fetched, the plan served
  #   stories.collection.GarbageCollectionRunIT   a run, a dry run, and one-at-a-time
  #   stories.faults.PeerFailureIT          a broken pin read, and what it does and does not stop
  #   stories.operations.RunHistoryIT       the plan before, the account after
  #   stories.refusals.DeletionRefusalIT    the doors on the write surface
  #
  #   api.PackagedSurfaceIT     NOT in the list: half of it is about the CLIENT (the base href at the
  #                             root, the deep links, the fallback that must not swallow
  #                             /orchestrator), which the quinoa line below deliberately does not
  #                             build. A blanket `-DskipITs=false` would make this run red on a test
  #                             that is right.
  #
  # THE ORDER OF THAT LIST IS NOT THE ORDER THEY RUN IN, and it must not be read as one. Class order is
  # the userflows orderer's: a topological sort over @UserflowRunsAfter, ties broken by fully-qualified
  # class name — so `api.*` runs before `stories.*`, and inside stories `collection` before `faults`
  # before `operations` before `refusals`. That is load-bearing rather than tidy: a cumulative capture
  # source is attributed by a cursor, so the startup JWKS fetch lands in whichever story drains first
  # and the outbound token mint (cached for an hour) lands in whichever story makes the first peer
  # call. Both are asserted on the story that owns them.
  #
  # ALL FIVE SHARE ONE @TestProfile, which is what makes them ONE launched process rather than five.
  # Two profiles would be two orchestrators, two boots, two JWKS fetches and two databases.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        "-Dit.test=TokenValidationBootstrapIT,GarbageCollectionRunIT,PeerFailureIT,RunHistoryIT,DeletionRefusalIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the one module that packages an artifact to boot; `orchestrator/` is a library jar.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-orchestrator-platform-service" \
        "$QITS_DOCS_URL/@userflows/qits-orchestrator-platform-service/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-orchestrator-platform-service@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-orchestrator-platform-service@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
